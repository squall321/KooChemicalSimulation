name: Code Coverage

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          lcov \
          libeigen3-dev \
          libfmt-dev \
          libspdlog-dev \
          nlohmann-json3-dev \
          libyaml-cpp-dev \
          libgtest-dev

    - name: Configure CMake with coverage
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON \
          -DBUILD_TESTING=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Initialize coverage
      run: |
        cd build
        lcov --zerocounters --directory .
        lcov --capture --initial --directory . --output-file coverage_base.info

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose

    - name: Capture coverage data
      run: |
        cd build
        lcov --capture --directory . --output-file coverage_test.info
        lcov --add-tracefile coverage_base.info \
             --add-tracefile coverage_test.info \
             --output-file coverage_total.info
        lcov --remove coverage_total.info \
             '/usr/*' \
             '*/external/*' \
             '*/third_party/*' \
             '*/tests/*' \
             '*/examples/*' \
             '*/benchmarks/*' \
             --output-file coverage_cleaned.info
        lcov --list coverage_cleaned.info

    - name: Generate HTML report
      run: |
        cd build
        mkdir -p coverage_html
        genhtml coverage_cleaned.info --output-directory coverage_html
        echo "Coverage report generated at build/coverage_html/index.html"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./build/coverage_cleaned.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: build/coverage_html/
        retention-days: 7

    - name: Coverage summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cd build
        lcov --summary coverage_cleaned.info 2>&1 | tee -a $GITHUB_STEP_SUMMARY
