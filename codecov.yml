# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: 70...100

  status:
    project:
      default:
        target: 70%          # Target coverage
        threshold: 2%        # Allow 2% decrease
        if_ci_failed: error

    patch:
      default:
        target: 80%          # New code should have higher coverage
        threshold: 5%
        if_ci_failed: error

  ignore:
    - "tests/**/*"           # Exclude test files
    - "examples/**/*"        # Exclude examples
    - "benchmarks/**/*"      # Exclude benchmarks
    - "external/**/*"        # Exclude external dependencies
    - "third_party/**/*"     # Exclude third-party code
    - "**/*.pb.h"            # Exclude protobuf generated files
    - "**/*.pb.cc"

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

# Ignore files based on paths
ignore:
  - "docs/**/*"
  - "scripts/**/*"
  - "cmake/**/*"
  - "*.md"
